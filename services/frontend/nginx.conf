server {
    listen 80 default_server;
    resolver 127.0.0.11 ipv6=off valid=30s;
    root /usr/share/nginx/html;
    index index.html;
    types {
        application/javascript mjs;
        text/html html;
        text/css css;
    }

    # Proxy /api/ to the real Gleam API container.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ES module MIME for .mjs files (Lustre's runtime module).
    location ~* \.(mjs|js)$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        try_files $uri =404;
    }

    # SPA fallback for unknown routes (Lustre has its own router inside the
    # app; the nginx side just serves index.html for any non-asset path).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
